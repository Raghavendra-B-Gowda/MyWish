<!DOCTYPE html>

<style>
        .input-focus-ring:focus-within {
            border-color: #000666;
            box-shadow: 0 0 0 4px rgba(0, 6, 102, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface font-body-lg min-h-screen flex flex-col pt-16 pb-24 md:hidden">
<!-- Top Navigation (Transactional, minimal) -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface-container-lowest border-b border-surface-variant flex items-center px-margin-mobile h-16 shadow-sm">
<button aria-label="Go Back" class="flex items-center text-primary" type="button">
<span class="material-symbols-outlined mr-2">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-on-surface flex-1">Create Certificate</h1>
</header>
<!-- Progress Indicator -->
<div class="px-margin-mobile py-stack-md bg-surface-container-lowest border-b border-surface-variant shadow-sm">
<div class="flex items-center justify-between mb-2 relative">
<div class="absolute top-1/2 left-0 w-full h-0.5 bg-surface-variant -z-10 -translate-y-1/2"></div>
<!-- Step 1: Template (Completed) -->
<div class="flex flex-col items-center z-10 bg-surface-container-lowest px-1">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md mb-1 shadow-sm">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>
<span class="font-caption text-caption text-primary font-medium">Template</span>
</div>
<!-- Step 2: Details (Active) -->
<div class="flex flex-col items-center z-10 bg-surface-container-lowest px-1">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md mb-1 shadow-sm shadow-primary/20">
                     2
                 </div>
<span class="font-caption text-caption text-primary font-bold">Details</span>
</div>
<!-- Step 3: Design (Pending) -->
<div class="flex flex-col items-center z-10 bg-surface-container-lowest px-1">
<div class="w-8 h-8 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1">
                     3
                 </div>
<span class="font-caption text-caption text-on-surface-variant">Design</span>
</div>
<!-- Step 4: Preview (Pending) -->
<div class="flex flex-col items-center z-10 bg-surface-container-lowest px-1">
<div class="w-8 h-8 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1">
                     4
                 </div>
<span class="font-caption text-caption text-on-surface-variant">Preview</span>
</div>
<!-- Step 5: Generate (Pending) -->
<div class="flex flex-col items-center z-10 bg-surface-container-lowest px-1">
<div class="w-8 h-8 rounded-full bg-surface-container text-on-surface-variant flex items-center justify-center font-label-md text-label-md mb-1">
                     5
                 </div>
<span class="font-caption text-caption text-on-surface-variant hidden sm:block">Generate</span>
</div>
</div>
</div>
<!-- Main Form Content -->
<main class="flex-1 px-margin-mobile py-stack-lg">
<form class="space-y-stack-md flex flex-col max-w-container-max mx-auto">
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-surface-variant shadow-sm space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-surface-variant pb-2">Recipient Information</h2>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="recipientName">Recipient Name</label>
<input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full placeholder:text-outline" id="recipientName" placeholder="Enter recipient's full name" type="text" value="Romeo"/>
</div>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email Address</label>
<input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full placeholder:text-outline" id="email" placeholder="recipient@example.com" type="email" value="example@gmail.com"/>
</div>
</div>
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-surface-variant shadow-sm space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-surface-variant pb-2">Course Details</h2>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="courseName">Course Title</label>
<input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full placeholder:text-outline" id="courseName" placeholder="e.g. Advanced Web Development" type="text" value="Web Development"/>
</div>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200"><label class="font-label-md text-label-md text-on-surface-variant mb-1">Duration Type</label><div class="flex p-1 bg-surface-container rounded-lg mb-3"><button class="flex-1 py-2 text-label-md font-bold rounded-md bg-primary text-on-primary shadow-sm transition-all" type="button">Hours</button><button class="flex-1 py-2 text-label-md font-medium text-on-surface-variant hover:bg-surface-variant/50 transition-all" type="button">Months</button></div><div class="flex flex-col gap-1"><label class="font-label-md text-label-md text-on-surface-variant" for="durationInput">Number of Hours</label><input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full placeholder:text-outline" id="durationInput" placeholder="e.g. 40" type="number" value="40"/></div></div>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="issueDate">Issue Date</label>
<input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full text-on-surface" id="issueDate" type="date" value="2026-08-09"/>
</div>
</div>
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-surface-variant shadow-sm space-y-stack-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface border-b border-surface-variant pb-2">Issuer Information</h2>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="organization">Organization Name</label>
<select class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full" id="organization"><option>Skillzo</option><option>Coursa</option><option>Learnix</option><option>Edvra</option><option>Skillra</option><option>Coursio</option><option>Edvixo</option><option>Learnova</option><option>Velora Interns</option><option>Clevora Careers</option><option>Skillora Internships</option><option>Skillvo</option><option>Kursly</option></select>
</div>
<div class="flex flex-col gap-1 input-focus-ring rounded-lg transition-all duration-200">
<label class="font-label-md text-label-md text-on-surface-variant" for="instructor">Instructor Name</label>
<input class="h-12 px-4 rounded-lg border border-surface-variant bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary font-body-md text-body-md w-full placeholder:text-outline" id="instructor" type="text" value="John Doe"/>
</div>
</div>
</form>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-variant p-margin-mobile shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-50">
<button class="w-full h-[48px] bg-primary text-on-primary rounded-lg font-label-md text-label-md flex items-center justify-center shadow-sm active:scale-[0.98] transition-transform" type="button">
            Continue to Design
        </button>
</div>
</body></html>
